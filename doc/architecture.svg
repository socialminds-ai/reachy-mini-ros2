<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 478" width="980" height="478"
     font-family="'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13" fill="#1a202c">
  <title>Reachy Mini ROS 2: how the pieces fit</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
    <marker id="arrow-zenoh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/>
    </marker>
    <style>
      .mono { font-family: 'DejaVu Sans Mono', Menlo, Consolas, monospace; font-size: 12px; }
      .title { font-weight: bold; font-size: 15px; }
      .sub { font-size: 12px; fill: #4a5568; }
      .small { font-size: 11px; fill: #4a5568; }
      .node { fill: #ffffff; stroke: #2b6cb0; stroke-width: 1.2; }
      .router { fill: #fffaf0; stroke: #b7791f; stroke-width: 1.5; }
      .hw { fill: #edf2f7; stroke: #4a5568; stroke-width: 1.2; }
    </style>
  </defs>

  <!-- opaque background: readable on light and dark pages -->
  <rect width="980" height="478" fill="#ffffff"/>

  <!-- ===================== the robot ===================== -->
  <rect x="20" y="20" width="600" height="438" rx="12" fill="#f7fafc" stroke="#4a5568" stroke-width="1.5"/>
  <text x="38" y="46" class="title">Reachy Mini</text>
  <text x="38" y="64" class="sub">Raspberry Pi CM4 · Raspberry Pi OS (Debian trixie) · user pollen</text>

  <!-- the ROS container -->
  <rect x="40" y="80" width="380" height="250" rx="10" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="56" y="102" font-weight="bold" fill="#2b6cb0">container reachy-mini-ros</text>
  <text x="404" y="102" class="small" text-anchor="end">Ubuntu · ROS 2 Lyrical</text>

  <rect x="56" y="114" width="170" height="30" rx="6" class="node"/>
  <text x="141" y="133" class="mono" text-anchor="middle">reachy_mini_driver</text>
  <rect x="236" y="114" width="168" height="30" rx="6" class="node"/>
  <text x="320" y="133" class="mono" text-anchor="middle">robot_state_publisher</text>

  <rect x="56" y="152" width="170" height="30" rx="6" class="node"/>
  <text x="141" y="171" class="mono" text-anchor="middle">camera</text>
  <rect x="236" y="152" width="168" height="30" rx="6" class="node"/>
  <text x="320" y="171" class="mono" text-anchor="middle">mic_frontend</text>

  <rect x="56" y="190" width="170" height="30" rx="6" class="node"/>
  <text x="141" y="209" class="mono" text-anchor="middle">pw_audio_play</text>
  <rect x="236" y="190" width="168" height="30" rx="6" class="node"/>
  <text x="320" y="209" class="mono" text-anchor="middle">asr_whistle</text>

  <rect x="56" y="228" width="170" height="30" rx="6" class="node"/>
  <text x="141" y="247" class="mono" text-anchor="middle">tts_pockettts</text>
  <rect x="236" y="228" width="168" height="30" rx="6" class="node" stroke-dasharray="4 3"/>
  <text x="320" y="247" text-anchor="middle" font-size="12">your nodes (~/ros)</text>

  <rect x="56" y="272" width="348" height="42" rx="6" class="router"/>
  <text x="230" y="290" text-anchor="middle" font-weight="bold" fill="#975a16">zenoh router</text>
  <text x="230" y="306" text-anchor="middle" class="small">listens on TCP 7447 (robot IP, --network host)</text>

  <!-- the Pollen daemon -->
  <rect x="440" y="80" width="160" height="140" rx="10" fill="#f2f2f2" stroke="#718096" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="520" y="104" text-anchor="middle" font-weight="bold" fill="#4a5568">Pollen daemon</text>
  <text x="520" y="122" text-anchor="middle" class="mono" font-size="11" fill="#4a5568">reachy-mini-daemon</text>
  <text x="520" y="148" text-anchor="middle" class="small">Pollen apps</text>
  <text x="520" y="164" text-anchor="middle" class="small">HTTP API :8000</text>
  <text x="520" y="180" text-anchor="middle" class="small">WebRTC</text>
  <text x="520" y="206" text-anchor="middle" class="small" font-style="italic">stopped while ROS drives</text>

  <!-- hardware -->
  <rect x="40" y="378" width="176" height="62" rx="8" class="hw"/>
  <text x="128" y="402" text-anchor="middle" font-weight="bold">servos</text>
  <text x="128" y="420" text-anchor="middle" class="mono" font-size="11">/dev/ttyAMA3</text>
  <rect x="232" y="378" width="176" height="62" rx="8" class="hw"/>
  <text x="320" y="402" text-anchor="middle" font-weight="bold">camera</text>
  <text x="320" y="420" text-anchor="middle" class="small">IMX708 wide, CSI</text>
  <rect x="424" y="378" width="176" height="62" rx="8" class="hw"/>
  <text x="512" y="402" text-anchor="middle" font-weight="bold">audio card</text>
  <text x="512" y="420" text-anchor="middle" class="small">XVF3800, via PipeWire</text>

  <!-- ROS -> hardware -->
  <line x1="128" y1="330" x2="128" y2="375" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="320" y1="330" x2="320" y2="375" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="330" x2="470" y2="375" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- daemon -> hardware -->
  <path d="M590,220 V360 H180" fill="none" stroke="#718096" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="180" y1="360" x2="180" y2="375" stroke="#718096" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <line x1="372" y1="360" x2="372" y2="375" stroke="#718096" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <line x1="560" y1="360" x2="560" y2="375" stroke="#718096" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="136" y="348" class="small">one owner: ROS or the daemon</text>
  <text x="474" y="348" class="small">audio: shared</text>

  <!-- ===================== your machine ===================== -->
  <rect x="680" y="80" width="280" height="250" rx="12" fill="#f0fff4" stroke="#2f855a" stroke-width="1.5"/>
  <text x="698" y="104" class="title" fill="#22543d">Your machine</text>
  <text x="698" y="122" class="sub">ROS 2 Lyrical, native or in a container</text>

  <rect x="698" y="134" width="118" height="30" rx="6" fill="#ffffff" stroke="#2f855a" stroke-width="1.2"/>
  <text x="757" y="153" class="mono" text-anchor="middle">rviz2</text>
  <rect x="826" y="134" width="118" height="30" rx="6" fill="#ffffff" stroke="#2f855a" stroke-width="1.2"/>
  <text x="885" y="153" class="mono" text-anchor="middle">ros2 CLI</text>
  <rect x="698" y="172" width="246" height="30" rx="6" fill="#ffffff" stroke="#2f855a" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="821" y="191" text-anchor="middle" font-size="12">your nodes</text>
  <text x="821" y="240" text-anchor="middle" class="mono" font-size="11" fill="#4a5568">RMW_IMPLEMENTATION=rmw_zenoh_cpp</text>

  <rect x="698" y="272" width="246" height="42" rx="6" class="router"/>
  <text x="821" y="290" text-anchor="middle" font-weight="bold" fill="#975a16">zenoh router</text>
  <text x="821" y="306" text-anchor="middle" class="small">connects to &lt;robot IP&gt;:7447</text>

  <!-- the zenoh link -->
  <line x1="407" y1="293" x2="695" y2="293" stroke="#b7791f" stroke-width="2.5" marker-start="url(#arrow-zenoh)" marker-end="url(#arrow-zenoh)"/>
  <text x="510" y="284" text-anchor="middle" font-size="12" font-weight="bold" fill="#975a16">TCP 7447</text>
  <text x="510" y="312" text-anchor="middle" class="small">all ROS traffic, no multicast</text>

  <text x="680" y="358" class="small">The robot has no ROS binaries for Debian:</text>
  <text x="680" y="374" class="small">ROS runs in the container, started by systemd</text>
  <text x="680" y="390" class="small">(reachy-mini-ros.service).</text>
</svg>
