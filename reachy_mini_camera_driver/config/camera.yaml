# Default parameters of the Reachy Mini camera driver. All of them can be
# changed at runtime (`ros2 param set /camera/camera width 1920`), except the
# read-only ones (source, camera_name, encoder, frame_id, camera_info_url).
/**:
  ros__parameters:
    source: libcamera          # or 'v4l2:/dev/video0', or 'test'
    encoder: v4l2h264enc       # Raspberry Pi hardware; x264enc / openh264enc elsewhere
    frame_id: camera_optical
    camera_info_url: ""        # empty: the installed calibration of the sensor mode in
                               # use (config/calibration_{wide,narrow}.yaml, scaled to
                               # other 16:9 sizes); or e.g. file:///root/ros/camera.yaml
    lazy: true                 # camera off while nobody subscribes

    # stream (changing one restarts the camera, about a second)
    # The IMX708 wide sensor is 4608x2592 (16:9); the ISP scales, other aspect
    # ratios are cropped. Maximum 1920x1080 with the hardware encoder
    # (v4l2h264enc), up to 4608x2592 with a software one. narrow: 1536 wide at most.
    width: 1280
    height: 720
    framerate: 30
    # Sensor mode; each one has its own calibration (calibration_*.yaml).
    #  wide:   the full sensor (2304x1296 binned), ~102 deg horizontally: sees
    #          people around the robot; more for the ISP to read and scale,
    #          up to ~56 fps, stronger distortion towards the edges.
    #  narrow: the central crop (1536x864 binned), ~77 deg: less ISP work, up
    #          to 120 fps, more pixels per degree at the same output size
    #          (faces further away), milder distortion.
    field_of_view: wide
    bitrate: 2000000           # bit/s; the compression level
    keyframe_interval: 60      # frames; new subscribers also get a keyframe at once
    h264_profile: high         # baseline, main or high

    # image controls (applied live)
    autofocus_mode: manual     # manual (fixed focus, keeps the calibration valid), continuous or auto
    lens_position: 0.667       # dioptres (1/distance in m): 0.667 = focus at 1.5 m; 0 = infinity
    exposure_value: 0.0        # EV
