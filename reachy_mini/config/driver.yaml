# Parameters of the Reachy Mini bare-metal driver (both the Python and the C++ node).
reachy_mini_driver:
  ros__parameters:
    serial_port: /dev/ttyAMA3          # servo bus; 'fake' = ideal simulated bus (no hardware)
    rate: 50.0                         # control loop frequency, Hz
    # move libraries: package://<package>/<dir> (ament index), a directory, or a HF dataset
    dataset: package://reachy_mini_expressions_data/emotions        # default library
    extra_datasets: ['package://reachy_mini_expressions_data/dances'] # more, for the motion skills
    skills_namespace: /skill           # ROS4HRI skills: <ns>/replay_motion, list_motions, look_at, ...
    motion_initial_goto: 0.5           # s, glide to the first sample of a motion before playing it
    glance_duration: 2.0               # s, how long look_at holds a GLANCE (C++ driver)
    tracking_lost_timeout: 1.0         # s, without TF for the target before look_at TRACKING gives up (C++ driver)
    wake_up_on_start: false            # start awake (rest pose) rather than asleep (sleep pose and an antenna wiggle)
    sleep_on_shutdown: true            # go to the sleep pose and release the motors on exit
    awake_parameter: /robot_blackboard/awake  # where to write whether the robot is awake ('' = nowhere)
    publish_tf: true                   # broadcast base_frame -> head and -> rod_1..6 on /tf
    base_frame: base_link              # the robot base frame (root of reachy_mini_description)
