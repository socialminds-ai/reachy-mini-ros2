# PipeWire nodes for the Reachy Mini Audio card (XMOS XVF3800, USB, 16 kHz
# stereo S16 in and out). Install in ~pollen/.config/pipewire/pipewire.conf.d/
# (see README.md, section 1.4).
#
# The nodes open the card through the ALSA aliases the Pollen daemon writes in
# ~/.asoundrc: `reachymini_audio_src` (dsnoop) and `reachymini_audio_sink`
# (dmix). The card can thus be shared with the daemon when it runs, and
# PipeWire never needs exclusive access to hw:0 (51-reachy-mini.conf
# keeps WirePlumber off it).
#
# Both capture channels carry the same stream: the XVF3800's processed output
# (4-mic beamforming, noise suppression, and echo cancellation against what is
# played on the card, whoever plays it).
context.objects = [
  { factory = adapter
    args = {
      factory.name = api.alsa.pcm.source
      node.name = reachy_mini_mic
      node.description = "Reachy Mini microphones (XVF3800 processed)"
      media.class = Audio/Source
      api.alsa.path = reachymini_audio_src
      audio.format = S16LE
      audio.rate = 16000
      audio.channels = 2
      audio.position = [ FL FR ]
      priority.session = 2000
      priority.driver = 2000
      session.suspend-timeout-seconds = 0
    }
  }
  { factory = adapter
    args = {
      factory.name = api.alsa.pcm.sink
      node.name = reachy_mini_speaker
      node.description = "Reachy Mini speaker"
      media.class = Audio/Sink
      api.alsa.path = reachymini_audio_sink
      audio.format = S16LE
      audio.rate = 16000
      audio.channels = 2
      audio.position = [ FL FR ]
      priority.session = 2000
      priority.driver = 2000
    }
  }
]
