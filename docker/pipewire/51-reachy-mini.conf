# Install in ~pollen/.config/wireplumber/wireplumber.conf.d/ (see README.md, section 1.4).

# WirePlumber leaves the Reachy Mini Audio card alone: PipeWire uses it through
# the daemon's dsnoop/dmix aliases instead (reachy-mini-audio.conf), so that
# neither takes the card exclusively.
monitor.alsa.rules = [
  { matches = [
      { api.alsa.card.name = "Reachy Mini Audio" }
      { device.product.name = "Reachy Mini Audio" }
    ]
    actions = { update-props = { device.disabled = true } }
  }
]

# No video in PipeWire: the camera belongs to reachy_mini_camera_driver, and a
# libcamera monitor would hold it (libcamera cameras have a single owner).
wireplumber.profiles = {
  main = {
    monitor.v4l2 = disabled
    monitor.libcamera = disabled
  }
}
