# The build/test/package/upload jobs are the lab's centralised ones
# (socialminds/socialminds-cicd). This file only adds the robot container image.
# The repo is registered as `type: ros2-custom` in socialminds-cicd/repos.yaml
# so that this file (and not the remote template) is the project's CI config.
include:
  - project: 'socialminds/socialminds-cicd'
    ref: main
    file: '/templates/default.gitlab-ci.yml'

# Must list every stage: an include does not merge `stages:`.
stages:
  - test
  - package
  - upload
  - trigger
  - image

# The ROS 2 container that runs on the robot (arm64, built under QEMU: slow,
# so it is a MANUAL job; run it from the pipeline page after changing docker/).
# Result: $CI_REGISTRY_IMAGE/reachy-mini-ros:lyrical, and
# $CI_REGISTRY_IMAGE/reachy-mini-ros:<latest release tag, e.g. 1.2.1>, the tag
# that reachy-mini-ros2-bootstrap pins (its files/image.env). Run it on the
# release commit, so that the versioned tag matches the release.
# Also the same two with -full: build tools and the Python SDK (docker/Dockerfile).
# Then bootstrap-pin has reachy-mini-ros2-bootstrap pin the versioned tag.
robot-image:
  stage: image
  image: docker:27
  services: [docker:27-dind]
  tags:
    - arm64
  needs: []
  variables:
    DOCKER_BUILDKIT: "1"
    GIT_DEPTH: 0   # all the history, so that git describe finds the latest tag
  before_script:
    - apk add --no-cache git
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker context create tls-ctx || true
    - docker buildx create tls-ctx --use --name multiarch --driver docker-container || docker buildx use multiarch
  script:
    - VERSION=${CI_COMMIT_TAG:-$(git describe --tags --abbrev=0)}
    - echo "image version $VERSION"
    - docker buildx build --platform linux/arm64
        -t "$CI_REGISTRY_IMAGE/reachy-mini-ros:lyrical"
        -t "$CI_REGISTRY_IMAGE/reachy-mini-ros:$VERSION"
        --push docker/
    # same layers + build tools and the Python SDK (Dockerfile, FULL)
    - docker buildx build --platform linux/arm64 --build-arg FULL=1
        -t "$CI_REGISTRY_IMAGE/reachy-mini-ros:lyrical-full"
        -t "$CI_REGISTRY_IMAGE/reachy-mini-ros:$VERSION-full"
        --push docker/
    - echo "ROBOT_IMAGE_VERSION=$VERSION" > robot-image.env
  artifacts:
    reports:
      dotenv: robot-image.env   # ROBOT_IMAGE_VERSION, for bootstrap-pin
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true

# Once the images are pushed: a pipeline of reachy-mini-ros2-bootstrap that, if
# the tag is not the one it pins already (files/image.env), pins it, adds a
# changelog entry and tags a new release (its pin-image job). Runs as the user
# who started robot-image, who needs to be allowed to run pipelines on the
# bootstrap's main branch.
bootstrap-pin:
  stage: image
  needs: [robot-image]
  variables:
    # from robot-image's dotenv, under another name: a variable that refers
    # to its own name is not expanded, and goes downstream as a literal
    REACHY_MINI_ROS_TAG: $ROBOT_IMAGE_VERSION
  trigger:
    project: socialminds/robots/reachymini/reachy_mini_ros2_bootstrap
    branch: main
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
