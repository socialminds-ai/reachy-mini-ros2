# The build/test/package/upload jobs are the lab's centralised ones
# (socialminds/socialminds-cicd). This file only adds the robot container image.
# The repo is registered as `type: ros2-custom` in socialminds-cicd/repos.yaml
# so that this file (and not the remote template) is the project's CI config.
include:
  - project: 'socialminds/socialminds-cicd'
    ref: main
    file: '/templates/default.gitlab-ci.yml'

# Must list every stage: an include does not merge `stages:`.
stages:
  - test
  - package
  - upload
  - trigger
  - image

# The ROS 2 container that runs on the robot (arm64). It does not build this
# repo: it installs its arm64 packages from the SocialMinds apt repo, so it
# waits for release-arm64 (Run pipeline with ARCH=arm64) when that is in the
# pipeline. Tag pushes do not build arm64: there, the image gets whatever arm64
# packages the apt repo has already.
# MANUAL jobs; run them from the pipeline page after a release or a change in
# docker/, on the release commit, so that the versioned tag matches the release.
# They push to the lab's Harbor registry, public, which the robots pull from:
# robot-image: $HARBOR_HOST/$HARBOR_PROJECT/reachy-mini-ros:lyrical, and
# $HARBOR_HOST/$HARBOR_PROJECT/reachy-mini-ros:<latest release tag, e.g. 1.2.1>,
# the tag that reachy-mini-ros2-bootstrap pins (its files/image.env).
# HARBOR_USERNAME and HARBOR_PASSWORD (a Harbor robot account allowed to push
# to the project) are CI/CD variables of the project or its group;
# HARBOR_HOST and HARBOR_PROJECT default to the values below, which CI/CD
# variables of the same name override.
# robot-image-full: the same two with -full: build tools and the Python SDK
# (docker/Dockerfile, FULL=1). Not built otherwise.
# Then bootstrap-pin has reachy-mini-ros2-bootstrap pin the versioned tag.
.robot-image:
  stage: image
  image: docker:27
  services: [docker:27-dind]
  tags:
    - arm64
  needs:
    - job: release-arm64
      optional: true
  variables:
    DOCKER_BUILDKIT: "1"
    GIT_DEPTH: 0   # all the history, so that git describe finds the latest tag
    FULL: "0"
    HARBOR_HOST: registry.apps.iiia.csic.es
    HARBOR_PROJECT: socialminds
  before_script:
    - apk add --no-cache git
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - echo "$HARBOR_PASSWORD" | docker login -u "$HARBOR_USERNAME" --password-stdin "$HARBOR_HOST"
    - docker context create tls-ctx || true
    - docker buildx create tls-ctx --use --name multiarch --driver docker-container || docker buildx use multiarch
  script:
    - VERSION=${CI_COMMIT_TAG:-$(git describe --tags --abbrev=0)}
    - SUFFIX=$([ "$FULL" = 1 ] && echo -full || true)
    - IMAGE=$HARBOR_HOST/$HARBOR_PROJECT/reachy-mini-ros
    - echo "image $IMAGE:$VERSION$SUFFIX"
    # No attestations: they make the image an index of two manifests, and
    # Harbor then refuses the second tag (412 Precondition Failed)
    - docker buildx build --platform linux/arm64 --build-arg FULL=$FULL
        --provenance=false --sbom=false
        -t "$IMAGE:lyrical$SUFFIX"
        -t "$IMAGE:$VERSION$SUFFIX"
        --push docker/
    - echo "ROBOT_IMAGE_VERSION=$VERSION" > robot-image.env
  artifacts:
    reports:
      dotenv: robot-image.env   # ROBOT_IMAGE_VERSION, for bootstrap-pin
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true

robot-image:
  extends: .robot-image

robot-image-full:
  extends: .robot-image
  variables:
    FULL: "1"

# Once the images are pushed: a pipeline of reachy-mini-ros2-bootstrap that, if
# the tag is not the one it pins already (files/image.env), pins it, adds a
# changelog entry and tags a new release (its pin-image job). Runs as the user
# who started robot-image, who needs to be allowed to run pipelines on the
# bootstrap's main branch.
bootstrap-pin:
  stage: image
  needs: [robot-image]
  variables:
    # from robot-image's dotenv, under another name: a variable that refers
    # to its own name is not expanded, and goes downstream as a literal
    REACHY_MINI_ROS_TAG: $ROBOT_IMAGE_VERSION
  trigger:
    project: socialminds/robots/reachymini/reachy_mini_ros2_bootstrap
    branch: main
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
